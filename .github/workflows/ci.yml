name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: vendor.zip
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python CHECK_ENVIRONMENT.py
      - run: python SMOKE_TEST.py
      - run: python TEST_HR_FOUNDATION.py
      - run: python TEST_INT01_MULTI_SOURCE.py
      - run: python TEST_INT02_ROSTER_LEAVE_LINK.py
      - run: python TEST_INT03_HTTP_MULTI_UPLOAD.py
      - run: python TEST_MIGRATION_EQUIVALENCE.py
      - run: python TEST_ECO_PUBLISHER.py
      - run: python TEST_HR_REGISTRY.py
      - run: python TEST_HR_SECURITY.py
      - run: python TEST_HR_DELIVERY.py
      - run: python TEST_HR_WORKFORCE.py
      - run: python TEST_HR_DISCIPLINE.py
      - run: python TEST_HR_ECO_INBOX.py
      - run: python TEST_HR_PEOPLE_OPS.py
      - run: python TEST_HR_SIMULATION.py
      - run: python TEST_DOCS_CURRENT.py
      - run: python migration/mutations.py
      - run: python BUILD_PROJECT.py
  signing-crosscheck:
    # ADR-HR-002: the standard library (cryptography) and BAMS's vendored fallback must agree, both directions.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: vendor.zip
      PYTHONIOENCODING: utf-8
      HR_REQUIRE_CROSSCHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - run: python TEST_HR_SECURITY.py
      - run: python TEST_HR_SECURITY.py
        env:
          HR_SIGNING_BACKEND: bams
  windows-installer:
    # phase 2.5 (docs/HR_DELIVERY.md): build HR-System-Setup.exe and accept the INSTALLED program -
    # no Python visible to it, outbound network blocked, install / update / failed update / power cut / removal.
    needs: test
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "nuitka>=2.4,<3" ordered-set zstandard cryptography
          choco upgrade innosetup -y --no-progress
      - name: Build HR-System.exe and the installer
        run: python tools/build_windows.py
      - name: Accept the installed program
        run: python tools/installed_acceptance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HR-System-Setup
          path: dist/HR-System-Setup-*.exe
          retention-days: 30
